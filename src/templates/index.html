<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bag Parser - ROS Bag 解析工具</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
                        <path d="M12 20C12 15.5817 15.5817 12 20 12C24.4183 12 28 15.5817 28 20C28 24.4183 24.4183 28 20 28" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="20" cy="20" r="3" fill="white"/>
                        <path d="M20 28L20 32" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <path d="M16 30L20 32L24 30" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#4f6ef7"/>
                                <stop offset="100%" stop-color="#2563eb"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Bag Parser</h1>
                    <p class="brand-subtitle">ROS Bag 文件解析与 CSV 导出工具 V1.0</p>
                </div>
            </div>
            <div class="header-mission">
                <span class="mission-tag">专注</span>
                <span class="mission-tag">创新</span>
                <span class="mission-tag">担当</span>
                <span class="mission-tag">融合</span>
                <p class="mission-text">致力于成为自动驾驶智能感知解决方案工业专家</p>
            </div>
            <div class="header-copyright">
                <p>@<a href="http://wfss.weifu.com.cn/index.html">威孚智感（无锡）科技有限公司</a> 版权所有</p>
            </div>
        </header>

        <!-- 步骤指示器 -->
        <div class="steps-indicator">
            <div class="step-indicator active" data-step="1">
                <div class="step-dot"><span>1</span></div>
                <span class="step-label">选择目录</span>
            </div>
            <div class="step-line"></div>
            <div class="step-indicator" data-step="2">
                <div class="step-dot"><span>2</span></div>
                <span class="step-label">选择文件</span>
            </div>
            <div class="step-line"></div>
            <div class="step-indicator" data-step="3">
                <div class="step-dot"><span>3</span></div>
                <span class="step-label">选择 Topic</span>
            </div>
            <div class="step-line"></div>
            <div class="step-indicator" data-step="4">
                <div class="step-dot"><span>4</span></div>
                <span class="step-label">完成导出</span>
            </div>
        </div>

        <main class="app-main">
            <!-- 第一步：路径选择 -->
            <section class="card" id="section-path">
                <div class="card-header">
                    <span class="step-badge">1</span>
                    <h2>选择 Bag 文件目录</h2>
                </div>
                <div class="card-body">
                    <div class="input-row">
                        <input
                            type="text"
                            id="path-input"
                            class="input"
                            placeholder="请输入 Bag 文件所在目录的绝对路径，如 /home/user/bags"
                            autocomplete="off"
                        >
                        <button id="btn-scan" class="btn btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                            <span>扫描</span>
                        </button>
                    </div>
                    <div class="path-hint" id="path-hint"></div>
                </div>
            </section>

            <!-- 第二步：Bag 文件列表 -->
            <section class="card" id="section-files" style="display:none;">
                <div class="card-header">
                    <span class="step-badge">2</span>
                    <h2>选择 Bag 文件</h2>
                </div>
                <div class="card-body">
                    <div class="info-bar" id="files-info"></div>
                    <div class="file-list" id="file-list"></div>
                </div>
            </section>

            <!-- 第三步：Topic 选择 -->
            <section class="card" id="section-topics" style="display:none;">
                <div class="card-header">
                    <span class="step-badge">3</span>
                    <h2>选择 Topic 并处理</h2>
                </div>
                <div class="card-body">
                    <div class="info-bar" id="topics-info"></div>
                    <div class="topic-toolbar">
                        <button id="btn-select-all" class="btn btn-sm btn-outline">全选</button>
                        <button id="btn-deselect-all" class="btn btn-sm btn-outline">取消全选</button>
                        <div class="msg-count-row">
                            <label for="max-msgs">每条导出消息数:</label>
                            <input type="number" id="max-msgs" class="input input-sm" value="3" min="1" max="100">
                            <label class="all-check" for="export-all">
                                <input type="checkbox" id="export-all">
                                导出全部
                            </label>
                        </div>
                    </div>
                    <div class="topic-list" id="topic-list"></div>
                    <div class="action-row">
                        <button id="btn-process" class="btn btn-primary btn-lg">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            <span>开始处理导出</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- 第四步：处理结果 -->
            <section class="card" id="section-result" style="display:none;">
                <div class="card-header">
                    <span class="step-badge done">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                    <h2>处理结果</h2>
                </div>
                <div class="card-body">
                    <div class="info-bar success" id="result-info"></div>
                    <div class="result-files" id="result-files"></div>
                </div>
            </section>
        </main>

        <!-- 状态 Toast -->
        <div id="toast" class="toast"></div>

        <!-- Loading 遮罩 -->
        <div id="loading-overlay" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
            <p id="loading-text">处理中...</p>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
